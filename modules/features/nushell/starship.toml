# ANSI names only, so it follows the terminal's light/dark theme
add_newline = true
format = "$directory$git_branch$git_state$git_status$nix_shell$cmd_duration$line_break$character"

[directory]
style = "bold"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"
read_only_style = "red"

[git_branch]
format = "[$branch]($style) "
style = ""

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "red"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bright-black"
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "»"
deleted = "-"

[nix_shell]
format = "[nix]($style) "
style = "bright-black"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "bright-black"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
